<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LOOKWHO 로고 프리미엄 SVG 애니메이션 – 5가지 모션 쇼케이스">
  <title>LOOKWHO · SVG Motion Showcase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════
       1. 디자인 토큰 — 다크(기본) / 라이트(보조)
       ─ 블랙 배경 위 얇은 그레이 타이포의 미니멀 브랜드 톤
    ═══════════════════════════════════════════════════════════ */
    :root {
      --bg:        #0A0A0A;
      --surface:   #111110;
      --text:      #B0ADA6;
      --muted:     #5A5850;
      --border:    rgba(255,255,255,0.06);
      --logo:      #B8B8B8;
      --logo-soft: rgba(180,178,172,0.40);
      --shine:     rgba(255,255,255,0.24);
    }
    .light {
      --bg:        #F2F0EC;
      --surface:   #FDFCFA;
      --text:      #3A3830;
      --muted:     #9A978F;
      --border:    rgba(0,0,0,0.07);
      --logo:      #4A4840;
      --logo-soft: rgba(74,72,64,0.35);
      --shine:     rgba(0,0,0,0.10);
    }

    /* ═══════════════════════════════════════════════════════════
       2. 리셋 & 기본 레이아웃
    ═══════════════════════════════════════════════════════════ */
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter','Outfit',system-ui,-apple-system,sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 32px 20px;
      transition: background .5s ease, color .5s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════════════════
       3. 테마 토글
    ═══════════════════════════════════════════════════════════ */
    .theme-toggle {
      position: fixed; top: 18px; right: 18px; z-index: 50;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-size: 15px; cursor: pointer;
      display: grid; place-items: center;
      transition: all .35s ease; opacity: .6;
    }
    .theme-toggle:hover { opacity: 1; color: var(--text); }

    /* ═══════════════════════════════════════════════════════════
       4. 스테이지 — 반응형 SVG 컨테이너
    ═══════════════════════════════════════════════════════════ */
    .stage {
      position: relative;
      width: min(92vw, 820px);
      aspect-ratio: 2407 / 1354;
      overflow: hidden;
      border-radius: 12px;
      background: var(--bg);
      transition: background .5s ease;
    }
    .stage svg {
      display: block; width: 100%; height: 100%;
    }
    .stage svg .bg-rect {
      transition: fill .5s ease;
    }

    /* ═══════════════════════════════════════════════════════════
       5. 하단 컨트롤러
    ═══════════════════════════════════════════════════════════ */
    .controls {
      display: flex; flex-wrap: wrap;
      justify-content: center; gap: 8px;
      max-width: 540px;
    }
    .ctrl-btn {
      font-family: 'Outfit',sans-serif;
      font-size: 12px; font-weight: 400;
      letter-spacing: .06em; padding: 8px 20px;
      border-radius: 99px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      cursor: pointer; transition: all .3s ease; user-select: none;
    }
    .ctrl-btn:hover {
      border-color: var(--text); color: var(--text);
    }
    .ctrl-btn.active {
      border-color: var(--text); color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    .light .ctrl-btn.active {
      background: rgba(0,0,0,0.04);
    }
    .ctrl-btn.replay {
      border-style: dashed; opacity: .5;
    }
    .ctrl-btn.replay:hover { opacity: .85; }

    /* ═══════════════════════════════════════════════════════════
       6. 샤인 오버레이
    ═══════════════════════════════════════════════════════════ */
    .shine-layer {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden; opacity: 0;
    }
    .shine-layer::after {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        110deg,
        transparent 38%,
        var(--shine) 50%,
        transparent 62%
      );
      transform: translateX(-120%);
      will-change: transform;
    }

    /* 와이프 엣지 그라데이션 마스크 */
    .wipe-edge {
      position: absolute; top: 0; bottom: 0;
      right: 0; width: 80px;
      pointer-events: none; opacity: 0;
      background: linear-gradient(to right, transparent, var(--bg));
    }

    /* ═══════════════════════════════════════════════════════════
       7. 키프레임
    ═══════════════════════════════════════════════════════════ */

    /* ① 그리기 — 외곽선 드로잉 */
    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }
    /* ① 그리기 — 잉크 채우기 */
    @keyframes drawFill {
      to { fill-opacity: 1; }
    }

    /* ② 시퀀스 — 아래→위 페이드인 + 디블러 */
    @keyframes seqRise {
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ③ 와이프 — 좌→우 클립패스 */
    @keyframes wipeReveal {
      to { clip-path: inset(0 0 0 0); }
    }

    /* ④ 분할 — 수직 확장 + 디블러 */
    @keyframes splitGrow {
      to { opacity: 1; transform: scaleY(1); filter: blur(0); }
    }

    /* ⑤ 샤인 — 스케일 안착 */
    @keyframes shineScale {
      0%   { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    /* ⑤ 샤인 — 대각선 실버 스와이프 */
    @keyframes shineSweep {
      from { transform: translateX(-120%); }
      to   { transform: translateX(120%); }
    }

    /* 와이프 엣지 이동 */
    @keyframes wipeEdgeMove {
      0%   { right: 100%; opacity: .6; }
      90%  { opacity: .3; }
      100% { right: 0%; opacity: 0; }
    }

    /* ═══════════════════════════════════════════════════════════
       8. 효과 클래스 — .stage에 적용
    ═══════════════════════════════════════════════════════════ */

    /* ── ① 그리기 (Draw) ────────────────────────────────── */
    .fx-draw .anim-el {
      fill-opacity: 0;
      stroke: var(--logo-soft);
      stroke-width: 1.5;
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
      animation:
        drawStroke 1.6s cubic-bezier(0.65,0,0.35,1) forwards,
        drawFill   0.7s ease forwards;
      animation-delay:
        calc(var(--i) * 120ms),
        calc(var(--i) * 120ms + 1200ms);
    }

    /* ── ② 시퀀스 (Sequence) ────────────────────────────── */
    .fx-sequence .anim-el {
      opacity: 0;
      transform: translateY(18px);
      filter: blur(4px);
      animation: seqRise .85s cubic-bezier(0.22,1,0.36,1) forwards;
      animation-delay: calc(var(--i) * 80ms);
    }

    /* ── ③ 와이프 (Wipe) ────────────────────────────────── */
    .fx-wipe svg {
      clip-path: inset(0 100% 0 0);
      animation: wipeReveal 1.2s cubic-bezier(0.65,0,0.35,1) forwards;
    }
    .fx-wipe .wipe-edge {
      opacity: 1;
      animation: wipeEdgeMove 1.2s cubic-bezier(0.65,0,0.35,1) forwards;
    }

    /* ── ④ 분할 (Split) ─────────────────────────────────── */
    .fx-split .anim-el {
      opacity: 0;
      transform: scaleY(0.04);
      transform-origin: center;
      filter: blur(3px);
      animation: splitGrow .9s cubic-bezier(0.16,1,0.3,1) forwards;
      animation-delay: calc(var(--i) * 75ms);
    }

    /* ── ⑤ 샤인 (Shine) ─────────────────────────────────── */
    .fx-shine svg {
      animation: shineScale .6s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .fx-shine .shine-layer {
      opacity: 1;
    }
    .fx-shine .shine-layer::after {
      animation: shineSweep 1.4s cubic-bezier(0.4,0,0.2,1) .45s both;
    }

    /* ═══════════════════════════════════════════════════════════
       9. 반응형
    ═══════════════════════════════════════════════════════════ */
    @media (max-width:600px) {
      body { gap: 28px; padding: 20px 12px; }
      .stage { width: 97vw; border-radius: 8px; }
      .controls { gap: 6px; }
      .ctrl-btn { font-size: 11px; padding: 7px 14px; }
    }
    @media (min-width:1400px) {
      .stage { max-width: 960px; }
    }
  </style>
</head>

  <!-- ═══ SVG 삽입 영역 끝 ═══ -->

  <!-- 하단 컨트롤러 -->
  <div class="controls" id="controls">
    <button class="ctrl-btn active" data-fx="draw">그리기</button>
    <button class="ctrl-btn" data-fx="sequence">시퀀스</button>
    <button class="ctrl-btn" data-fx="wipe">와이프</button>
    <button class="ctrl-btn" data-fx="split">분할</button>
    <button class="ctrl-btn" data-fx="shine">샤인</button>
    <button class="ctrl-btn replay" data-fx="replay">↻ 다시 재생</button>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════
       LOOKWHO SVG 모션 엔진
       ─ 글자별 분리 SVG 최적화
       ─ 어떤 SVG로 교체하더라도 동일 작동
    ═══════════════════════════════════════════════════════════ */
    (() => {
      'use strict';

      const stage  = document.getElementById('stage');
      const svg    = document.getElementById('logo');
      const toggle = document.getElementById('themeToggle');
      const btns   = [...document.querySelectorAll('.ctrl-btn')];

      const FX = ['fx-draw','fx-sequence','fx-wipe','fx-split','fx-shine'];
      let currentFx = 'draw';

      /* ─────────────────────────────────────────────────────
         1. SVG 요소 탐색 · X좌표 정렬 · CSS 변수 주입
      ───────────────────────────────────────────────────── */
      function initElements() {
        const vb = svg.viewBox.baseVal;

        // 배경 rect 자동 식별 (뷰박스 85% 이상 커버)
        svg.querySelectorAll('rect').forEach(r => {
          const b = r.getBBox();
          if (b.width >= vb.width * 0.85 && b.height >= vb.height * 0.85) {
            r.classList.add('bg-rect');
          }
        });

        // 애니메이션 대상 수집 (배경 rect 제외)
        const selectors =
          'path, rect:not(.bg-rect), circle, ellipse, line, polyline, polygon';
        const els = [...svg.querySelectorAll(selectors)];

        // X 좌표 기준 좌→우 정렬
        els.sort((a, b) => {
          try { return a.getBBox().x - b.getBBox().x; }
          catch { return 0; }
        });

        // --i (인덱스) · --len (외곽선 길이) 주입
        els.forEach((el, i) => {
          el.classList.add('anim-el');
          el.style.setProperty('--i', i);

          let len = 0;
          try {
            if (typeof el.getTotalLength === 'function') {
              len = el.getTotalLength();
            }
          } catch { /* fallback */ }

          // getTotalLength 미지원 시 바운딩 박스 둘레 추정
          if (!len) {
            try {
              const b = el.getBBox();
              len = 2 * (b.width + b.height);
            } catch { len = 500; }
          }

          el.style.setProperty('--len', len);
        });

        return els;
      }

      /* ─────────────────────────────────────────────────────
         2. 테마 전환
         ─ 배경 rect + path fill 색상 동기화
         ─ 원본 SVG의 opacity 비율 보존
      ───────────────────────────────────────────────────── */
      function applyTheme() {
        const isLight = document.body.classList.contains('light');
        toggle.textContent = isLight ? '☀' : '☾';

        // 배경 rect
        const bgRect = svg.querySelector('.bg-rect');
        if (bgRect) {
          bgRect.setAttribute('fill', isLight ? '#FDFCFA' : '#0A0A0A');
        }

        // LOOKWHO 워드마크 그룹
        const wordmark = svg.querySelector('#lookwho-wordmark');
        if (wordmark) {
          wordmark.setAttribute('fill', isLight ? '#4A4840' : '#B8B8B8');
          wordmark.setAttribute('opacity', isLight ? '0.85' : '0.63');
        }

        // 한글 서브텍스트 (영문보다 약한 명도)
        const subtitle = svg.querySelector('#korean-subtitle');
        if (subtitle) {
          subtitle.setAttribute('fill', isLight ? '#4A4840' : '#FFFFFF');
          subtitle.setAttribute('opacity', isLight ? '0.22' : '0.12');
        }
      }

      /* ─────────────────────────────────────────────────────
         3. 효과 전환
         ─ 클래스 제거 → 리플로우 → 새 클래스 적용
      ───────────────────────────────────────────────────── */
      function applyFx(fx) {
        FX.forEach(c => stage.classList.remove(c));
        void stage.offsetWidth;   // 리플로우 강제 – 재시작 보장
        stage.classList.add(`fx-${fx}`);
        currentFx = fx;
      }

      /* ─────────────────────────────────────────────────────
         4. 이벤트 바인딩
      ───────────────────────────────────────────────────── */
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          const fx = btn.dataset.fx;

          if (fx === 'replay') {
            applyFx(currentFx);
            return;
          }

          // 활성 버튼 전환
          btns.forEach(b => {
            if (b.dataset.fx !== 'replay') b.classList.remove('active');
          });
          btn.classList.add('active');
          applyFx(fx);
        });
      });

      toggle.addEventListener('click', () => {
        document.body.classList.toggle('light');
        applyTheme();
      });

      /* ─────────────────────────────────────────────────────
         5. 초기화
      ───────────────────────────────────────────────────── */
      function init() {
        // 시스템 라이트 모드 감지 (기본은 다크)
        if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.body.classList.add('light');
        }
        initElements();
        applyTheme();
        applyFx('draw');
      }

      if (document.readyState === 'complete') init();
      else window.addEventListener('load', init);
    })();
  </script>
